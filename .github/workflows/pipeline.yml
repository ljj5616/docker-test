name: Node.js CI and CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Package application
        run: tar -czf app.tar.gz src public package.json package-lock.json
      - uses: actions/upload-artifact@v4
        with:
          name: application
          path: app.tar.gz
          retention-days: 7

  deploy:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.ENABLE_CD == 'true'
    runs-on: [self-hosted, linux, notepad]
    environment: production
    concurrency:
      group: notepad-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: application
          path: artifact
      - name: Deploy and check health
        run: bash scripts/deploy.sh artifact/app.tar.gz
