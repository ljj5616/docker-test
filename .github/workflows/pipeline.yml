name: Docker CI and ECR CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 514287510278.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: docker-test

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Check deployment scripts
        run: |
          bash -n scripts/deploy.sh
          bash -n scripts/deploy-ssh.sh
          bash -n scripts/test-container.sh
      - name: Test deployment failure handling
        run: bash test/deploy.test.sh
      - name: Build Docker image
        run: docker build -t docker-test:ci .
      - name: Test container saving and restart
        run: bash scripts/test-container.sh
      - name: Save tested image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save docker-test:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: tested-image
          path: image.tar.gz
          retention-days: 1

  publish:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Push tested image to ECR
        id: image
        run: |
          docker load -i image.tar.gz
          IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker tag docker-test:ci "$IMAGE"
          docker push "$IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [ci, publish]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: notepad-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to AWS for EC2 registry login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy over SSH and check health
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
          DEPLOY_IMAGE: ${{ needs.publish.outputs.image }}
        run: bash scripts/deploy-ssh.sh
